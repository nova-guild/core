name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - uses: ./.github/actions/install-lpm
      - run: lpm --version

      - name: Install Dependencies
        run: lpm i

      - name: Lint Check
        working-directory: .
        run: lpm run lint:check

      - name: Format Check
        working-directory: .
        run: lpm run format:check

      - name: Run Test
        working-directory: .
        run: lpm test
